services:
  app:
    build: .
    container_name: magento_app
    user: "1000:1000"
    volumes:
      - ./src:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db
      - opensearch
      - redis
      - rabbitmq
    networks:
      - magento

  nginx:
    image: nginx:alpine
    container_name: magento_nginx
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - magento

  db:
    image: mysql:8.0
    container_name: magento_db
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - magento

  opensearch:
    image: opensearchproject/opensearch:2.5.0
    container_name: magento_opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      compatibility.override_main_response_version: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    networks:
      - magento

  redis:
    image: redis:alpine
    container_name: magento_redis
    networks:
      - magento

  rabbitmq:
    image: rabbitmq:3-management
    container_name: magento_rabbitmq
    ports:
      - "15672:15672"
    networks:
      - magento

networks:
  magento:
    driver: bridge

volumes:
  db_data:
